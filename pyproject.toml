[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rcc-refcert"
dynamic = ["version"]
description = "Python reference implementation for finite-control certificates in structure-fair quantum circuit complexity"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [
  {name = "HongZheng Liu"},
  {name = "YiNuo Tian"},
  {name = "Zhiyue Wu"},
]
keywords = [
  "quantum computing",
  "quantum information",
  "quantum simulation",
  "open quantum systems",
  "quantum control",
  "quantum circuit complexity",
  "circuit complexity",
  "certificate verification",
  "prefix coding",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.26",
]

[project.urls]
Paper = "https://arxiv.org/abs/2509.18205"
Repository = "https://github.com/yeruciwenrou-dotcom/rcc-refcert"

[project.scripts]
rcc-refcert = "rcc_refcert.cli:main"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.11"]
notebook = [
  "ipykernel>=6",
  "jupyterlab>=4",
  "nbclient>=0.10",
  "nbformat>=5.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "rcc_refcert._version.__version__"}

[tool.setuptools.package-data]
rcc_refcert = ["reference_data/*.json", "reference_data/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
